[package]
name = "swarm-web"
description = "Hosted multi-tenant web backend for SWARM Automation (issue #416, part of #413)."
# Placeholder like the desktop's: the published version is computed from
# VERSION (see .claude/rules/versioning.md). Do not hand-sync it.
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/SWARM-Media-Steaming/swarm-automation"
publish = false

# A standalone package on purpose: the desktop's root Cargo.toml has no
# [workspace], and this one must not join it (the desktop build stays as is).

[lib]
name = "swarm_web"
path = "src/lib.rs"

[[bin]]
name = "swarm-web"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
