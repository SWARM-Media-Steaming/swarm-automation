# Worker image and the isolation the orchestrator applies to every job
# (issue #418). Compose does not start a long-running worker: the JobRunner
# creates one container per job and destroys it afterwards.
#
#   docker compose -f web/docker-compose.jobs.yml --profile manual build
#   docker compose -f web/docker-compose.yml up -d   # Postgres and MinIO
#
# The production image is web/worker/Dockerfile (pinned git, gh and provider
# CLIs). This file builds the fixture image so an acceptance run does not
# download those CLIs. Point the orchestrator at either image with
# SWARM_WEB_WORKER_IMAGE; the entrypoint path is the same.
services:
  worker:
    profiles: ["manual"]
    build:
      context: ..
      dockerfile: web/worker/Dockerfile.fixture
    image: swarm-automation-worker:fixture
    read_only: true
    user: "1000:1000"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,size=256m
      - /workspace:rw,nosuid,size=2g
      - /home/swarm:rw,nosuid,size=512m
    extra_hosts:
      - "169.254.169.254:0.0.0.0"
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
    # No volumes. A job's workspace and HOME are the tmpfs mounts above.
    networks: ["swarm-jobs"]

networks:
  swarm-jobs:
    name: swarm-jobs
    driver: bridge
