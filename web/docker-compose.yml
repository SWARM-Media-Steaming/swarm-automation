# Local Postgres + MinIO for hosted storage (issue #417). Dev credentials only.
#   docker compose -f web/docker-compose.yml up -d
# See docs/web-architecture.md ("Local development") for the SWARM_STORAGE_* variables.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: swarm
      POSTGRES_DB: swarm
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm -d swarm"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev
      MINIO_ROOT_PASSWORD: devpassword
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  minio-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 dev devpassword; do sleep 1; done;
      mc mb --ignore-existing local/swarm-dev
      "
