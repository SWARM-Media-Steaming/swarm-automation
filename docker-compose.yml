# The whole hosted stack on one machine (issue #421):
#
#   cp web/.env.example .env      # then fill in the GitHub App values
#   docker compose up --build
#   open http://localhost:8080
#
# API (web/Dockerfile) + Postgres + MinIO (S3) + the Docker job runner. The API
# starts one container per repository job from the worker image through the
# host's Docker socket, so the socket is mounted into the API container (see
# "Local stack" in docs/web-architecture.md for what that means). Dev
# credentials below are for this machine only; nothing here is a deployment.
# AWS is web/infra/aws (Terraform) and is never applied by this file.
#
# Variables come from .env (Compose reads it automatically). `docker compose
# config` fails with the name of any required one that is missing.
name: swarm

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: swarm
      POSTGRES_DB: swarm
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The platform schema (idempotent; applied on the first start only).
      - ./web/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm -d swarm"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [stack]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev
      MINIO_ROOT_PASSWORD: devpassword
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [stack]

  minio-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 dev devpassword; do sleep 1; done;
      mc mb --ignore-existing local/swarm-dev
      "
    networks: [stack]

  # Builds the worker image the Docker runner starts for every job, then exits.
  # The default is the real image (pinned git, gh and provider CLIs). For a
  # run that must not download those, set
  #   SWARM_WORKER_DOCKERFILE=web/worker/Dockerfile.fixture
  # and SWARM_WORKER_IMAGE=swarm-automation-worker:fixture in .env.
  worker-image:
    build:
      context: .
      dockerfile: ${SWARM_WORKER_DOCKERFILE:-web/worker/Dockerfile}
    image: ${SWARM_WORKER_IMAGE:-swarm-automation-worker:local}
    entrypoint: ["/bin/true"]
    restart: "no"
    networks: [stack]

  api:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: swarm-automation-api:local
    depends_on:
      postgres:
        condition: service_healthy
      minio-bucket:
        condition: service_completed_successfully
      worker-image:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    # The Docker socket is how DockerJobRunner starts jobs. Its group must be
    # able to read it: DOCKER_GID=$(stat -c %g /var/run/docker.sock) on Linux;
    # the default (0) is what Docker Desktop and Rancher Desktop expose.
    group_add: ["${DOCKER_GID:-0}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      SWARM_WEB_BIND: 0.0.0.0:8080
      # The origin the browser uses. It is also the OAuth callback origin and
      # the CSRF Origin check; keep it in step with the GitHub App.
      SWARM_WEB_PUBLIC_URL: ${SWARM_WEB_PUBLIC_URL:-http://localhost:8080}
      SWARM_WEB_GITHUB_CLIENT_ID: ${SWARM_WEB_GITHUB_CLIENT_ID:?set the GitHub App client id in .env}
      SWARM_WEB_GITHUB_CLIENT_SECRET: ${SWARM_WEB_GITHUB_CLIENT_SECRET:?set the GitHub App client secret in .env}
      SWARM_WEB_GITHUB_WEBHOOK_SECRET: ${SWARM_WEB_GITHUB_WEBHOOK_SECRET:?set the GitHub App webhook secret in .env}
      SWARM_WEB_GITHUB_APP_SLUG: ${SWARM_WEB_GITHUB_APP_SLUG:-}
      SWARM_WEB_GITHUB_APP_ID: ${SWARM_WEB_GITHUB_APP_ID:?set the GitHub App id in .env}
      SWARM_WEB_GITHUB_APP_PRIVATE_KEY: ${SWARM_WEB_GITHUB_APP_PRIVATE_KEY:?set the GitHub App private key (PEM; \n escapes allowed) in .env}
      SWARM_WEB_LOCAL_KEY: ${SWARM_WEB_LOCAL_KEY:?set a base64 32-byte key in .env (see web/.env.example)}
      SWARM_WEB_INTERNAL_TOKEN: ${SWARM_WEB_INTERNAL_TOKEN:-}
      SWARM_WEB_TRUSTED_AUTHORS: ${SWARM_WEB_TRUSTED_AUTHORS:-}
      # GitHub logins or numeric ids that may become the first platform admin.
      SWARM_WEB_BOOTSTRAP_ADMINS: ${SWARM_WEB_BOOTSTRAP_ADMINS:-}
      # Worker bridge and jobs.
      SWARM_WEB_BRIDGE: python
      SWARM_WEB_JOB_RUNNER: docker
      SWARM_WEB_WORKER_IMAGE: ${SWARM_WORKER_IMAGE:-swarm-automation-worker:local}
      SWARM_WEB_DOCKER_NETWORK: swarm-stack
      SWARM_WEB_POLL_SECS: ${SWARM_WEB_POLL_SECS:-60}
      # Identity, tenants, sessions, keys, usage and job slots live in the
      # Postgres below (migrations apply at start); sessions survive a restart.
      # The DSN is SWARM_STORAGE_POSTGRES_DSN, one setting for the API's own
      # tables and the worker's history.
      SWARM_WEB_STORE: postgres
      # Hosted storage, shared by the bridge and every job container. The job
      # containers sit on the same network, so the hostnames below resolve for
      # them too.
      SWARM_JOB_STORAGE: hosted
      SWARM_STORAGE_POSTGRES_DSN: postgresql://swarm:swarm@postgres:5432/swarm
      SWARM_STORAGE_POSTGRES_DRIVER: psycopg:connect
      SWARM_STORAGE_S3_ENDPOINT: http://minio:9000
      SWARM_STORAGE_S3_BUCKET: swarm-dev
      SWARM_STORAGE_S3_ACCESS_KEY_ID: dev
      SWARM_STORAGE_S3_SECRET_ACCESS_KEY: devpassword
      SWARM_STORAGE_S3_ADDRESSING: path
      # Plain HTTP to MinIO on a private network; AWS uses HTTPS and never this.
      SWARM_STORAGE_S3_ALLOW_INSECURE_HTTP: "1"
    networks: [stack]

volumes:
  postgres-data:
  minio-data:

networks:
  stack:
    # A fixed name: the Docker runner attaches job containers to it by name.
    name: swarm-stack
    driver: bridge
