# Cross-provider model catalog for the SWARM dynamic model router.
#
# One entry per (provider, model). `model` is the exact slug the app already
# invokes providers with — these must stay in sync with the slugs in
# issue_worker/dynamic_router.py's _MODEL_CATALOG and src/config.rs's
# default_routing_tiers(); a model missing here cannot be routed to.
#
# Scales (all 1-5, comparable across providers):
#   relative_capability       1 = lightest, 5 = frontier/deepest reasoning
#   relative_cost              1 = cheapest, 5 = most expensive
#   relative_token_efficiency  1 = most tokens per task, 5 = fewest
#   relative_latency           1 = slowest, 5 = fastest
#
# data_quality on each benchmark entry: MEASURED (real benchmark run),
# DERIVED (computed from a MEASURED sibling entry), or HEURISTIC (an
# estimate from relative_capability, never fabricated benchmark numbers).
# Unmeasured fields are left null rather than guessed. Benchmarks are keyed
# by reasoning effort because measured results at one effort (e.g. "max")
# must not be assumed to hold at another (e.g. "medium").

models:
  - provider: anthropic
    agent: claude
    model: claude-haiku-4-5
    model_id: claude-haiku-4-5-20251001
    active: true
    recommended: true
    deprecated: false
    superseded_by: null
    supported_efforts: [low, medium]
    strengths: [routing, classification, trivial_tasks, simple_transformations, documentation, lightweight_fixes]
    weaknesses: [difficult_autonomous_repository_work, deep_debugging, architecture, large_refactor]
    relative_capability: 1
    relative_cost: 1
    relative_token_efficiency: 5
    relative_latency: 5
    benchmarks:
      low:
        coding_agent_index: null
        deep_swe: null
        terminal_bench: null
        swe_atlas_qna: null
        benchmark_cost_per_task: null
        benchmark_tokens_per_task: null
        benchmark_runtime_minutes: null
