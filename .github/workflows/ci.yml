name: CI

on:
  push:
    branches: [main, ai-main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# PR test runs are keyed per ref so a new push supersedes the previous one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            web
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      # The hosted backend is its own Cargo project (web/), not a workspace member.
      - name: Web backend fmt, clippy and tests
        working-directory: web
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked
      - name: Issue-worker Python tests
        working-directory: issue_worker
        run: python3 -m unittest discover -p 'test_*.py'
      - name: Frontend tests
        run: npm test
      - name: Version-computation script tests
        working-directory: scripts
        run: python3 -m unittest test_compute_version

  # The deployment files (docs/web-architecture.md, "Local stack" and "AWS
  # mapping"). Nothing here builds or pushes an image, signs in to AWS or
  # applies Terraform: those are documented steps for a human.
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.1
          terraform_wrapper: false
      - name: Terraform format and validate (no backend, no credentials)
        working-directory: web/infra/aws
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Compose file validates, and refuses an empty .env
        run: |
          printf '%s\n' \
            'SWARM_WEB_GITHUB_CLIENT_ID=Iv1.ci' \
            'SWARM_WEB_GITHUB_CLIENT_SECRET=ci' \
            'SWARM_WEB_GITHUB_WEBHOOK_SECRET=ci' \
            'SWARM_WEB_GITHUB_APP_ID=1' \
            'SWARM_WEB_GITHUB_APP_PRIVATE_KEY=-----BEGIN PRIVATE KEY-----\nci\n-----END PRIVATE KEY-----' \
            "SWARM_WEB_LOCAL_KEY=$(openssl rand -base64 32)" > "$RUNNER_TEMP/ci.env"
          docker compose --env-file "$RUNNER_TEMP/ci.env" config -q
          if docker compose --env-file /dev/null config -q 2>/dev/null; then
            echo "compose must refuse a missing .env" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web
      - name: Deployment contract and smoke test of the API binary
        working-directory: web
        env:
          SWARM_WEB_PUBLIC_URL: http://127.0.0.1:18080
          SWARM_WEB_BIND: 127.0.0.1:18080
          SWARM_WEB_UI_DIR: ../ui
          SWARM_WEB_GITHUB_CLIENT_ID: Iv1.ci
          SWARM_WEB_GITHUB_CLIENT_SECRET: ci
          SWARM_WEB_GITHUB_WEBHOOK_SECRET: ci
        run: |
          cargo build --locked --bin swarm-web
          SWARM_WEB_LOCAL_KEY="$(openssl rand -base64 32)" ./target/debug/swarm-web &
          pid=$!
          trap 'kill "$pid"' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:18080/api/v1/health >/dev/null && break
            sleep 1
          done
          python3 ../scripts/web_smoke.py http://127.0.0.1:18080
      - name: Deployment-file contract tests
        working-directory: issue_worker
        run: python3 -m unittest test_web_deploy

  # File a tracked issue when CI breaks on main or ai-main, so SWARM
  # Automation picks it up (assigned to the worker's configured assignee,
  # labelled ci-failure). PR failures are the author's to fix and are
  # skipped.
  report-failure:
    needs: [test, web-deploy]
    if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: File or update the CI-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.SWARM_ISSUE_ASSIGNEE || 'DotNetRockStar' }}
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          subject="$(git log -1 --pretty=%s)"
          failed_jobs="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')"
          [ -n "$failed_jobs" ] || failed_jobs="unknown"

          gh label create ci-failure --repo "$REPO" --color B60205 \
            --description "CI failure filed automatically" --force >/dev/null 2>&1 || true

          body_file="$RUNNER_TEMP/ci-failure.md"
          branch="${GITHUB_REF#refs/heads/}"
          {
            printf 'CI failed on `%s`.\n\n' "$branch"
            printf '| | |\n|---|---|\n'
            printf '| Run | %s |\n' "$RUN_URL"
            printf '| Commit | `%s` — %s |\n' "$short_sha" "$subject"
            printf '| Failed jobs | **%s** |\n\n' "$failed_jobs"
            printf '## Task\n\n'
            printf 'Open the run above, read the failed job log, and fix the root cause on a branch.\n\n'
            printf 'Close this issue once CI is green again.\n'
          } > "$body_file"

          existing="$(gh issue list --repo "$REPO" --state open --label ci-failure \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file "$body_file"
            echo "Updated existing issue #$existing"
          else
            gh issue create --repo "$REPO" \
              --title "CI: $failed_jobs failed at $short_sha" \
              --body-file "$body_file" \
              --label ci-failure \
              --assignee "$ASSIGNEE"
          fi
