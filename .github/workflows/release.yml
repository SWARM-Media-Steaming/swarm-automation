name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One release at a time; never cancel an in-flight publish. PR test runs are
# keyed per ref so a new push supersedes the previous one.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Issue-worker Python tests
        working-directory: issue_worker
        run: python3 -m unittest test_swarm_issue_worker

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          V="0.1.$(git rev-list --count HEAD)"
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Stamp version into manifests
        run: |
          V="${{ steps.version.outputs.value }}"
          tmp="$(mktemp)"
          jq --arg v "$V" '.version = $v' tauri.conf.json > "$tmp" && mv "$tmp" tauri.conf.json
          sed -i '' -E "s/^version = \"[0-9.]+\"/version = \"$V\"/" Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Release notes
        id: notes
        run: |
          {
            echo "body<<EOF"
            git log --pretty='- %s' "$(git describe --tags --match 'automation-v*' --abbrev=0 2>/dev/null || echo HEAD~20)"..HEAD | head -40
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: automation-v${{ steps.version.outputs.value }}
          releaseName: SWARM Automation ${{ steps.version.outputs.value }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Prune old releases (keep newest 20)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[20:] | .[].tagName' \
          | while read -r tag; do
              [ -n "$tag" ] || continue
              echo "Deleting old release $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
