name: CI

on:
  push:
    branches: [main, ai-main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# PR test runs are keyed per ref so a new push supersedes the previous one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Issue-worker Python tests
        working-directory: issue_worker
        run: python3 -m unittest test_swarm_issue_worker

  # File a tracked issue when CI breaks on main or ai-main, so SWARM
  # Automation picks it up (assigned to the worker's configured assignee,
  # labelled ci-failure). PR failures are the author's to fix and are
  # skipped. This never gates on the release job below: a release failure
  # (e.g. a still-missing TAURI_SIGNING_PRIVATE_KEY secret) is operator
  # setup, not a code regression to file an issue about.
  report-failure:
    needs: [test]
    if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: File or update the CI-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ vars.SWARM_ISSUE_ASSIGNEE || 'DotNetRockStar' }}
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          subject="$(git log -1 --pretty=%s)"
          failed_jobs="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')"
          [ -n "$failed_jobs" ] || failed_jobs="unknown"

          gh label create ci-failure --repo "$REPO" --color B60205 \
            --description "CI failure filed automatically" --force >/dev/null 2>&1 || true

          body_file="$RUNNER_TEMP/ci-failure.md"
          branch="${GITHUB_REF#refs/heads/}"
          {
            printf 'CI failed on `%s`.\n\n' "$branch"
            printf '| | |\n|---|---|\n'
            printf '| Run | %s |\n' "$RUN_URL"
            printf '| Commit | `%s` — %s |\n' "$short_sha" "$subject"
            printf '| Failed jobs | **%s** |\n\n' "$failed_jobs"
            printf '## Task\n\n'
            printf 'Open the run above, read the failed job log, and fix the root cause on a branch.\n\n'
            printf 'Close this issue once CI is green again.\n'
          } > "$body_file"

          existing="$(gh issue list --repo "$REPO" --state open --label ci-failure \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file "$body_file"
            echo "Updated existing issue #$existing"
          else
            gh issue create --repo "$REPO" \
              --title "CI: $failed_jobs failed at $short_sha" \
              --body-file "$body_file" \
              --label ci-failure \
              --assignee "$ASSIGNEE"
          fi

  # Computed once and shared by every platform in the `release` matrix below
  # so macOS/Windows/Linux publish under the identical tag/version — tauri-
  # action appends each platform's artifacts (and latest.json entry) to the
  # one release that tag names, so a mismatched version per job would split
  # a single publish across multiple releases instead.
  compute-version:
    needs: [test]
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ai-main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          base="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${{ github.ref }}" = "refs/heads/ai-main" ]; then
            # A run number never repeats, so this is unique by construction —
            # no need to check for an existing beta of the same base version.
            version="${base}-beta.${RUN_NUMBER}"
            prerelease=true
          else
            # main publishes every time too. If the base version hasn't
            # moved since the last published main release, append build
            # metadata so the tag (and GitHub Release) is never a duplicate.
            existing="$(gh release list --repo "$REPO" --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease == false) | .tagName' \
              | grep -E "^v${base}(\+main\.[0-9]+)?$" || true)"
            if [ -n "$existing" ]; then
              version="${base}+main.${RUN_NUMBER}"
            else
              version="${base}"
            fi
            prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  # NOTE for whoever revisits this: semver build metadata (the `+main.<n>`
  # suffix) is explicitly ignored in version-precedence comparisons per the
  # semver spec, which tauri-plugin-updater's comparator follows. Two
  # `0.1.0+main.4` / `0.1.0+main.5` releases likely compare as *equal*, so
  # the "notify"/"Automatically" startup check may never fire between two
  # main pushes that didn't bump the base Cargo.toml version. This was
  # flagged rather than silently worked around per the issue that added
  # this workflow (#90) — if that turns out to be a real problem in
  # practice, the fallback discussed there is requiring main publishes to
  # only happen on an actual version bump instead of every push.
  release:
    needs: [compute-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Stamp the published version into Cargo.toml and tauri.conf.json
        shell: bash
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          rm Cargo.toml.bak
          python3 -c "import json, os; path = 'tauri.conf.json'; data = json.load(open(path)); data['version'] = os.environ['VERSION']; json.dump(data, open(path, 'w'), indent=2)"
      # Beta (ai-main) releases are always prerelease and are never allowed
      # to read as the repo's "Latest release"; main releases never are.
      - name: Build and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the binary by build.rs so the running app can report
          # the exact published version (including this suffix), not just
          # whatever plain semver is hand-written in Cargo.toml.
          SWARM_APP_VERSION: ${{ needs.compute-version.outputs.version }}
          # Matches the updater pubkey already embedded in tauri.conf.json.
          # Until this secret is set, every platform build in this job
          # fails at the bundling step (see the repo's release-job-needs-
          # signing-secrets note) — that is expected until a human adds it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.compute-version.outputs.tag }}
          releaseName: >-
            ${{ needs.compute-version.outputs.prerelease == 'true' && '🧪 Beta' || 'SWARM Automation' }}
            ${{ needs.compute-version.outputs.version }}
          releaseBody: >-
            ${{ needs.compute-version.outputs.prerelease == 'true'
              && '🧪 Beta / pre-prod build, published automatically from `ai-main`. May be unstable — use a Release build for day-to-day use.'
              || 'Published automatically after this commit passed CI on `main`.' }}
          releaseDraft: false
          prerelease: ${{ needs.compute-version.outputs.prerelease }}
          args: ${{ matrix.args }}
