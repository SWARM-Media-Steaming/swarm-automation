[package]
name = "swarm-automation"
description = "Desktop control center for AI issue workers and UAT schedulers on any local Git checkout."
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/SWARM-Media-Steaming/swarm-automation"
default-run = "swarm-automation"

[[bin]]
name = "swarm-automation"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Cargo unifies this with the [dependencies] tauri entry for test builds
# only — `test` never reaches a production build.
tauri = { version = "2", features = ["test"] }
tempfile = "3"

# Keep useful filename/line-number backtraces without retaining full macOS
# debug data or large incremental snapshots for every unattended build.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
